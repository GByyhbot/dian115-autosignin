name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: tinygo-org/setup-tinygo@v1
        with:
          install-binaryen: true
      - run: npm ci
      - run: go test ./...
      - run: npm run build
      - run: npm run check
      - run: npm run test:wasm
